spring.datasource.url=jdbc:h2:mem:basic_user_api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
security.jwt.secret=test-only-secret-with-at-least-thirty-two-bytes

# Keep unrelated tests independent of shared rate-limit counters.
security.login.ip-limit=1000
security.login.account-limit=1000
