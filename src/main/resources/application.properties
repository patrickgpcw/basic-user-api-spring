spring.application.name=basic-user-api-spring
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/basic_user_api}
spring.datasource.username=${DB_USERNAME:basic_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=${JWT_SECRET}
security.jwt.ttl=PT1H
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.swagger-ui.persist-authorization=false
